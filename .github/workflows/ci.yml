name: ci
on: [push, pull_request]
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Vector (VRL sandbox for parser tests)
        run: |
          curl -sSfL https://github.com/vectordotdev/vector/releases/download/v0.55.0/vector-0.55.0-x86_64-unknown-linux-musl.tar.gz | tar xz
          echo "PRIVASOC_VECTOR_BIN=$PWD/vector-x86_64-unknown-linux-musl/bin/vector" >> $GITHUB_ENV
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest -q
