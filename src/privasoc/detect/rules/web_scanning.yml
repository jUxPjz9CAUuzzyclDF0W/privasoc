title: Web content scanning from one source
id: 6d7b0a52-3c1e-4a0f-9b1e-2f6a8c1d0006
status: experimental
description: At least 30 requests for missing pages from the same source address within 5 minutes.
author: privasoc
correlation:
  type: event_count
  rules:
    - privasoc_http_404
  group-by:
    - source.ip
  timespan: 5m
  condition:
    gte: 30
falsepositives:
  - A broken link crawled repeatedly by a search engine
level: medium
tags:
  - attack.reconnaissance
  - attack.t1595
