{% macro badge(s) %}<span class="badge {{ s }}">{{ s }}</span>{% endmacro %}
{% macro post(action, label, fields, cls="") %}
<form method="post" action="{{ action }}">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  {% for k, v in fields.items() %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endfor %}
  <button class="{{ cls }}">{{ label }}</button>
</form>
{% endmacro %}
{% macro host_link(source) %}<a href="/ui/host?source={{ source|q }}">{{ source }}</a>{% endmacro %}
{% macro parser_link(id) %}<a href="/ui/parser?id={{ id|q }}"><code>{{ id }}</code></a>{% endmacro %}
