# Local LLM is NOT part of this stack: point PRIVASOC_LLM_LOCAL_URL at any
# OpenAI-compatible server (Ollama, llama.cpp, vLLM) on your GPU machine (D11, D36).
services:
  privasoc:
    build: .
    env_file: .env
    environment:
      PRIVASOC_HOST: 0.0.0.0
      PRIVASOC_DATA_DIR: /data
    volumes:
      - ./data:/data
    ports:
      - "${PRIVASOC_BIND:-127.0.0.1}:8000:8000"
    restart: unless-stopped

  vector:
    image: timberio/vector:0.55.0-debian
    command: ["--config", "/etc/vector/vector.yaml"]
    env_file: .env
    environment:
      PRIVASOC_INGEST_URL: http://privasoc:8000/ingest
    volumes:
      - ./vector:/etc/vector:ro
      - ./data/inbox:/inbox:ro
      - vector-data:/var/lib/vector
    ports:
      - "5514:5514/udp"
      - "5514:5514/tcp"
    depends_on: [privasoc]
    restart: unless-stopped

volumes:
  vector-data:
